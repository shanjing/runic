name: Deploy Prometheus to EKS

on:
  workflow_dispatch:        # allow manual trigger
  push:
    branches: [ "main" ]
    paths:
      - "kubernetes/helm/**"
      - ".github/workflows/deploy-prometheus.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write        # needed for AWS OIDC auth
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403692606562:role/ci-eks-deployer
          aws-region: us-west-2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name trevoux --region us-west-2

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Prometheus Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy Prometheus stack
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f kubernetes/helm/charts/prometheus/prometheus-values.yaml
