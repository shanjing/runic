apiVersion: v1
kind: Namespace
metadata:
  name: stratus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-app
  namespace: stratus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-app
  template:
    metadata:
      labels:
        app: simple-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: simple-app
        image: shanjing/simple-app:dev-v1.0.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: simple-app
---
apiVersion: v1
kind: Service
metadata:
  name: simple-app
  namespace: stratus
spec:
  selector:
    app: simple-app
  ports:
  - port: 80
    targetPort: 8080
