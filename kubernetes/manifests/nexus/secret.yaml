# This is a template for secrets. In production, use AWS Secrets Manager or HashiCorp Vault
# and inject secrets via External Secrets Operator or similar tools.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: coordination-system
  labels:
    app: nexus
type: Opaque
stringData:
  # Database Credentials (these should be fetched from AWS Secrets Manager)
  DB_HOST: "nexus-coordination-cluster-db.REGION.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "nexusdb"
  DB_USER: "nexusadmin"
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  
  # TLS Certificates (should be managed by cert-manager in production)
  TLS_CERT: ""
  TLS_KEY: ""
  TLS_CA: ""
  
  # HSM Configuration (if using external HSM)
  HSM_ENDPOINT: ""
  HSM_API_KEY: ""
  
  # Additional secrets
  JWT_SECRET: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  ENCRYPTION_KEY: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY"
---
