# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nexus-metrics
  namespace: coordination-system
  labels:
    app: nexus
    component: coordination
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: nexus
      component: coordination
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
  namespaceSelector:
    matchNames:
    - coordination-system

