apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-service-account
  namespace: coordination-system
  annotations:
    # This will be populated by Terraform with the IAM role ARN
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/nexus-coordination-cluster-nexus-sa-role"
  labels:
    app: nexus

