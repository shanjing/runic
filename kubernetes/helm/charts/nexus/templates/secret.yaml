{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus.fullname" . }}-secrets
  namespace: {{ include "nexus.namespace" . }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database Credentials
  DB_HOST: {{ .Values.secrets.database.host | quote }}
  DB_PORT: {{ .Values.secrets.database.port | quote }}
  DB_NAME: {{ .Values.secrets.database.name | quote }}
  DB_USER: {{ .Values.secrets.database.user | quote }}
  DB_PASSWORD: {{ .Values.secrets.database.password | quote }}
  
  # TLS Certificates
  TLS_CERT: {{ .Values.secrets.tls.cert | quote }}
  TLS_KEY: {{ .Values.secrets.tls.key | quote }}
  TLS_CA: {{ .Values.secrets.tls.ca | quote }}
  
  # HSM Configuration
  HSM_ENDPOINT: {{ .Values.secrets.hsm.endpoint | quote }}
  HSM_API_KEY: {{ .Values.secrets.hsm.apiKey | quote }}
  
  # Application Secrets
  JWT_SECRET: {{ .Values.secrets.app.jwtSecret | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.app.encryptionKey | quote }}
{{- end }}

